<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Control</title>
</head>
<body>
        <h1>Login - Smart control</h1>
  
        <h2>Login</h2>

        <form method="get" action="dashboard.html">
            <label for="email">email</label><br>
            <input type="email" id="email" name="email" placeholder="Enter" required><br>
            <label for="password">senha</label><br>
            <input type="password" id="senha" name="senha" placeholder="Enter" required>
            <input type="submit" value="entrar"> <br><br>

            <button>Criar conta</button> <br><br>
            <button>Esqueci minha senha</button><br>
        </form>
    
</body>
</html>
